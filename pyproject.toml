[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamt"
version = "0.1.0a1"
description = "dbt for streaming - declarative streaming pipelines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "streamt contributors" }
]
keywords = ["kafka", "streaming", "dbt", "flink", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "confluent-kafka>=2.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "sqlglot>=26.0,<30",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy==1.19.1",
    "types-pyyaml",
    "types-jsonschema>=4.26",
    "types-requests==2.33.0.20260712",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
streamt = "streamt.cli:main"

[project.urls]
Homepage = "https://conduktor.github.io/streamt"
Documentation = "https://conduktor.github.io/streamt"
Repository = "https://github.com/conduktor/streamt"
Issues = "https://github.com/conduktor/streamt/issues"
Changelog = "https://conduktor.github.io/streamt/reference/release-notes/"

[tool.hatch.build.targets.wheel]
packages = ["src/streamt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: mark test as integration test requiring Docker",
    "slow: mark test as slow (may take > 30 seconds)",
    "kafka: mark test as requiring Kafka",
    "flink: mark test as requiring Flink",
    "connect: mark test as requiring Kafka Connect",
    "schema_registry: mark test as requiring Schema Registry",
    "postgres: mark test as requiring an explicit real PostgreSQL test server",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W",  # Core: pycodestyle, pyflakes, isort, naming, warnings
    "B",                        # Bugbear: common pitfalls
    "S",                        # Bandit: security checks
    "T20",                      # No print() in production code
    "SIM",                      # Simplify: unnecessary complexity
    "C4",                       # Comprehension flaws
    "UP",                       # Pyupgrade: modern Python syntax
    "RUF",                      # Ruff-specific rules
    "PT",                       # Pytest style
    "ERA",                      # Commented-out code
    "TID251",                   # Banned APIs (typing.Any)
    "ARG",                      # Unused function arguments
]
ignore = [
    "E501",                     # Line length handled by formatter
    "S101",                     # assert OK in tests + DSL validation
    "S608",                     # Hardcoded SQL expected — this is a SQL compiler
    "S110",                     # try-except-pass used intentionally in deployers
    "S105", "S106", "S107",     # Hardcoded passwords: false positives on test fixtures
    "UP045",                    # Optional[X] vs X | None — keep for 3.10 compat
    "RUF012",                   # Mutable class defaults OK in dataclasses/pydantic
    "SIM105",                   # contextlib.suppress — less readable than try/except pass
    "SIM102",                   # Collapsible if — often clearer when nested
    "N803",                     # Mock params like MockAdmin are intentional in tests
    "RUF022",                   # __all__ sort order not critical
    "S701",                     # Jinja2 autoescape — we generate SQL, not HTML
    "RUF015",                   # next(iter(x)) vs list(x)[0] — low priority
    "ERA001",                   # Commented-out code — acceptable during active dev
    "SIM108",                   # Ternary vs if/else — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S",                        # Security checks irrelevant in tests
    "T20",                      # print() OK in tests
    "ERA001",                   # Commented code OK in tests
    "TID251",                   # Any OK in tests (MagicMock, fixtures)
    "ARG",                      # Unused args common in fixtures/mocks
    "N806",                     # Uppercase vars OK in tests (class names as locals)
    "B017",                     # pytest.raises(Exception) OK in tests
    "PT011",                    # pytest.raises(Exception) broad match OK in tests
]
"src/streamt/cli/**" = [
    "T20",                      # CLI uses print/click.echo
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use explicit types instead of Any. Use object for truly unknown types, or define a Protocol/TypeAlias."

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# Strict modules — must pass cleanly
[[tool.mypy.overrides]]
module = [
    "streamt.core.models",
    "streamt.deployer.ssl_utils",
    "streamt.core.errors",
]
strict = true
warn_return_any = true
disallow_untyped_defs = true

# Deployers — gradual adoption (fix via #43)
[[tool.mypy.overrides]]
module = [
    "streamt.deployer.kafka",
    "streamt.deployer.planner",
    "streamt.deployer.connect",
    "streamt.deployer.flink",
    "streamt.deployer.schema_registry",
    "streamt.deployer.gateway",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "yaml.*"]
ignore_missing_imports = true

# Gradual adoption — environment has many untyped defs
[[tool.mypy.overrides]]
module = "streamt.core.environment"
ignore_errors = true
