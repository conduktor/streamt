name: streamt reviewed plan
description: Validate a streamt project and create a deterministic reviewed plan
author: Conduktor

inputs:
  project-directory:
    description: Project directory, relative to the GitHub workspace
    required: false
    default: .
  environment:
    description: Optional streamt environment name
    required: false
    default: ""
  offline:
    description: Plan without infrastructure connectivity; set false for live planning
    required: false
    default: "true"
  python-version:
    description: Python version used to run streamt
    required: false
    default: "3.12"
  plan-path:
    description: Reviewed plan output path, relative to the GitHub workspace
    required: false
    default: .streamt/reviewed-plan.json

outputs:
  plan-path:
    description: Absolute path to the saved reviewed plan
    value: ${{ steps.streamt-plan.outputs.plan-path }}
  plan-checksum:
    description: Integrity checksum of the saved reviewed plan
    value: ${{ steps.streamt-plan.outputs.plan-checksum }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install streamt from this action
      shell: bash
      env:
        STREAMT_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$STREAMT_ACTION_PATH"

    - name: Validate and create reviewed plan
      id: streamt-plan
      shell: bash
      env:
        STREAMT_ACTION_PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        STREAMT_ACTION_ENVIRONMENT: ${{ inputs.environment }}
        STREAMT_ACTION_OFFLINE: ${{ inputs.offline }}
        STREAMT_ACTION_PLAN_PATH: ${{ inputs.plan-path }}
      run: python -m streamt.integrations.github_action

branding:
  icon: git-pull-request
  color: purple
