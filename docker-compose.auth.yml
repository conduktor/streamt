# Docker Compose override for auth/SSL integration tests.
# Usage: docker compose -f docker-compose.yml -f docker-compose.auth.yml up kafka schema-registry schema-registry-auth -d
#
# Overrides:
#   - kafka: Replaces with Confluent CP image + SASL_PLAINTEXT listener on port 9094.
# Adds:
#   - schema-registry-auth: Schema Registry behind nginx basic auth on port 8085

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: streamt-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
      - "9101:9101"
    volumes:
      - ./tests/fixtures/kafka-sasl-jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092,SASL_PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092,SASL_PLAINTEXT://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAINTEXT
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # nginx reverse proxy adding basic auth in front of Schema Registry
  schema-registry-auth:
    image: nginx:alpine
    hostname: schema-registry-auth
    container_name: streamt-schema-registry-auth
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "8085:80"
    volumes:
      - ./tests/fixtures/nginx-sr-auth.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/fixtures/sr-htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "sruser:srpass", "http://localhost:80/subjects"]
      interval: 5s
      timeout: 3s
      retries: 10
