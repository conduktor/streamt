name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact version tag to rehearse on TestPyPI
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Verify exact CI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ci_run_attempt: ${{ steps.ci.outputs.run_attempt }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_NAME: ${{ github.event.release.name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify exact tag, commit, version, and main ancestry
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${RELEASE_IS_PRERELEASE}" != "true" ]]; then
            echo "The first alpha must be published as a GitHub prerelease" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${RELEASE_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "The GitHub release title must exactly match its version tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "The workflow ref must be the exact requested version tag" >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              sys.exit(f"release tag {tag!r} must equal package version tag v{version}")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"RELEASE_VERSION={version}\n")
          PY

          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          release_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          test "${release_sha}" = "${tag_sha}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${release_sha}" origin/main
          printf 'RELEASE_SHA=%s\n' "${release_sha}" >> "${GITHUB_ENV}"
          printf 'release_sha=%s\n' "${release_sha}" >> "${GITHUB_OUTPUT}"
          printf 'release_tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Require successful full CI for the exact release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          release_sha = os.environ["RELEASE_SHA"]
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "head_sha": release_sha,
                  "status": "completed",
                  "per_page": 100,
              }
          )
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          successful_runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("conclusion") == "success"
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == release_sha
          ]
          if not successful_runs:
              sys.exit(f"no successful full CI run found for release commit {release_sha}")
          newest = max(successful_runs, key=lambda run: run["run_attempt"])
          print(f"verified exact-SHA CI run: {newest['html_url']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={newest['id']}\n")
              output.write(f"run_attempt={newest['run_attempt']}\n")
          PY

      - name: Download the exact distributions tested by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions-${{ steps.ci.outputs.run_attempt }}
          path: dist/
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Inspect downloaded distributions
        run: |
          python -m pip install 'twine==7.0.0'
          python -m twine check --strict dist/*

      - name: Record distribution SHA-256 digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*

      - name: Install and verify wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail

          wheels=(dist/*.whl)
          source_distributions=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one wheel" >&2
            exit 1
          fi
          if [[ ${#source_distributions[@]} -ne 1 || ! -f "${source_distributions[0]}" ]]; then
            echo "Expected exactly one source distribution" >&2
            exit 1
          fi

          artifacts=("${wheels[0]}" "${source_distributions[0]}")
          for index in "${!artifacts[@]}"; do
            artifact="$(realpath "${artifacts[${index}]}")"
            venv="${RUNNER_TEMP}/streamt-release-${index}"
            python -m venv "${venv}"
            "${venv}/bin/python" -m pip install 'pip==26.2.1'
            "${venv}/bin/python" -m pip install --progress-bar off "${artifact}"
            "${venv}/bin/python" -m pip check
            cd "${RUNNER_TEMP}"
            env -u PYTHONPATH \
              RELEASE_VERSION="${RELEASE_VERSION}" \
              RELEASE_CHECKOUT="${GITHUB_WORKSPACE}" \
              "${venv}/bin/python" -I - <<'PY'
          import importlib.metadata
          import os
          import subprocess
          import sys
          from pathlib import Path

          import streamt

          expected = os.environ["RELEASE_VERSION"]
          checkout = Path(os.environ["RELEASE_CHECKOUT"]).resolve()
          installed_module = Path(streamt.__file__).resolve()
          assert checkout not in installed_module.parents, installed_module
          assert importlib.metadata.version("streamt") == expected
          assert streamt.__version__ == expected
          completed = subprocess.run(
              [str(Path(sys.executable).with_name("streamt")), "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert completed.stdout == f"streamt, version {expected}\n"
          assert completed.stderr == ""
          PY
            cd "${GITHUB_WORKSPACE}"
          done

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/streamt/
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}

    steps:
      - name: Reverify immutable release tag after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def load(url: str) -> dict[str, object]:
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=30
              ) as response:
                  return json.load(response)

          encoded_tag = urllib.parse.quote(tag, safe="")
          target = load(f"{api}/git/ref/tags/{encoded_tag}").get("object")
          for _ in range(8):
              if not isinstance(target, dict):
                  sys.exit("release tag lookup returned an invalid object")
              target_type = target.get("type")
              target_sha = target.get("sha")
              if target_type == "commit":
                  if target_sha != os.environ["RELEASE_SHA"]:
                      sys.exit("release tag moved after distribution verification")
                  print(f"reverified immutable release tag at {target_sha}")
                  break
              if target_type != "tag" or not isinstance(target_sha, str):
                  sys.exit("release tag did not resolve to a commit")
              target = load(f"{api}/git/tags/{target_sha}").get("object")
          else:
              sys.exit("release tag indirection exceeds the supported bound")
          PY

      - name: Download release distributions
        # Pin every action in the OIDC-bearing job, not only the publisher.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions-${{ needs.build.outputs.ci_run_attempt }}
          path: dist/
          run-id: ${{ needs.build.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Publish distributions with trusted publishing
        # Reviewed release/v1 commit; keep credential-bearing actions immutable.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  publish-testpypi:
    name: Rehearse publication on TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/streamt/
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}

    steps:
      - name: Reverify immutable release tag after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def load(url: str) -> dict[str, object]:
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=30
              ) as response:
                  return json.load(response)

          encoded_tag = urllib.parse.quote(tag, safe="")
          target = load(f"{api}/git/ref/tags/{encoded_tag}").get("object")
          for _ in range(8):
              if not isinstance(target, dict):
                  sys.exit("release tag lookup returned an invalid object")
              target_type = target.get("type")
              target_sha = target.get("sha")
              if target_type == "commit":
                  if target_sha != os.environ["RELEASE_SHA"]:
                      sys.exit("release tag moved after distribution verification")
                  print(f"reverified immutable release tag at {target_sha}")
                  break
              if target_type != "tag" or not isinstance(target_sha, str):
                  sys.exit("release tag did not resolve to a commit")
              target = load(f"{api}/git/tags/{target_sha}").get("object")
          else:
              sys.exit("release tag indirection exceeds the supported bound")
          PY

      - name: Download verified rehearsal distributions
        # Pin every action in the OIDC-bearing job, not only the publisher.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions-${{ needs.build.outputs.ci_run_attempt }}
          path: dist/
          run-id: ${{ needs.build.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Publish distributions to TestPyPI with trusted publishing
        # Reviewed release/v1 commit; keep credential-bearing actions immutable.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
