name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and scenario tests
        run: python -m pytest tests/unit tests/scenarios --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: ruff check src/ tests/

  type-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enforce mypy error ceiling
        run: python scripts/check_mypy_baseline.py

  gateway-strict-observer:
    name: Conduktor Gateway 3.15 strict observe/delete/adopt
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start Kafka and Conduktor Gateway
        run: |
          docker compose pull kafka conduktor-gateway
          docker compose up -d kafka conduktor-gateway

      - name: Wait for Conduktor Gateway readiness
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl --fail --silent http://127.0.0.1:8888/health >/dev/null \
            && curl --fail --silent --user admin:conduktor \
              http://127.0.0.1:8888/gateway/v2/alias-topic >/dev/null; do
            if (( SECONDS >= deadline )); then
              docker compose ps
              exit 1
            fi
            sleep 2
          done

      - name: Run strict managed observe/delete/adopt gate
        env:
          STREAMT_TEST_GATEWAY_STRICT_OBSERVER: '1'
          STREAMT_TEST_GATEWAY_ADMIN_URL: http://127.0.0.1:8888
          STREAMT_TEST_GATEWAY_ADMIN_USER: admin
          STREAMT_TEST_GATEWAY_ADMIN_PASSWORD: conduktor
          STREAMT_TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        run: >-
          python -m pytest
          tests/integration/test_gateway_strict_observer_real.py
          --tb=short

      - name: Collect Gateway service logs
        if: always()
        shell: bash
        run: |
          mkdir -p gateway-strict-observe-delete-adopt-artifacts
          docker compose ps \
            > gateway-strict-observe-delete-adopt-artifacts/compose-status.txt 2>&1 || true
          docker compose logs --no-color kafka conduktor-gateway \
            > gateway-strict-observe-delete-adopt-artifacts/compose.log 2>&1 || true

      - name: Upload Gateway service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-strict-observe-delete-adopt-logs
          path: gateway-strict-observe-delete-adopt-artifacts/
          if-no-files-found: warn

      - name: Stop Gateway services
        if: always()
        run: docker compose down --volumes --remove-orphans

  connector-removal-real:
    name: Kafka Connect 7.5.0 reviewed removal / PostgreSQL ${{ matrix.postgres-major }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres-major: ['14', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres-major }}
        env:
          POSTGRES_USER: streamt_ci_bootstrap
          POSTGRES_PASSWORD: streamt-ci-bootstrap-only
          POSTGRES_DB: streamt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamt_ci_bootstrap -d streamt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      STREAMT_TEST_POSTGRES_ADMIN_DSN: postgresql://streamt_ci_bootstrap:streamt-ci-bootstrap-only@127.0.0.1:5432/streamt_ci?sslmode=disable
      STREAMT_TEST_POSTGRES_MAJOR: ${{ matrix.postgres-major }}
      STREAMT_TEST_REAL_CONNECT_REMOVAL: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Verify PostgreSQL readiness and major
        run: python tests/postgres/check_server.py

      - name: Start pinned Kafka, Schema Registry, and Connect
        timeout-minutes: 4
        run: |
          docker compose pull kafka schema-registry connect
          docker compose up -d --wait --wait-timeout 180 \
            kafka schema-registry connect

      - name: Run public reviewed Connector removal gate
        timeout-minutes: 4
        run: >-
          python -m pytest
          tests/postgres/test_postgres_connector_removal_connect_real.py
          --tb=short

      - name: Collect bounded Connector service logs
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p connector-removal-real-artifacts
          timeout 15s docker compose ps \
            > connector-removal-real-artifacts/compose-status.txt 2>&1 || true
          raw_log="${RUNNER_TEMP}/connector-removal-real-compose.log"
          timeout 30s docker compose logs --no-color --tail=500 \
            kafka schema-registry connect \
            > "${raw_log}" 2>&1 || true

          scan_status=0
          grep -Eq 'target-config-secret-|unrelated-config-secret-' \
            "${raw_log}" || scan_status=$?
          if [[ ${scan_status} -eq 0 ]]; then
            printf '%s\n' \
              'Provider logs contained a forbidden fixture-secret sentinel.' \
              > connector-removal-real-artifacts/secret-scan-failed.txt
            exit 1
          fi
          if [[ ${scan_status} -ne 1 ]]; then
            printf '%s\n' \
              'Provider log secrecy scan could not be completed.' \
              > connector-removal-real-artifacts/secret-scan-failed.txt
            exit 1
          fi
          cp "${raw_log}" connector-removal-real-artifacts/compose.log

      - name: Upload Connector service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connector-removal-real-${{ matrix.postgres-major }}-logs
          path: connector-removal-real-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Connector services
        if: always()
        timeout-minutes: 2
        run: docker compose down --volumes --remove-orphans

  postgres-conformance:
    name: PostgreSQL ${{ matrix.postgres-major }} conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-major: ['14', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres-major }}
        env:
          POSTGRES_USER: streamt_ci_bootstrap
          POSTGRES_PASSWORD: streamt-ci-bootstrap-only
          POSTGRES_DB: streamt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamt_ci_bootstrap -d streamt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      STREAMT_TEST_POSTGRES_ADMIN_DSN: postgresql://streamt_ci_bootstrap:streamt-ci-bootstrap-only@127.0.0.1:5432/streamt_ci?sslmode=disable
      STREAMT_TEST_POSTGRES_MAJOR: ${{ matrix.postgres-major }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PostgreSQL test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Verify PostgreSQL readiness and major
        run: python tests/postgres/check_server.py

      - name: Run real PostgreSQL conformance tests
        run: python -m pytest tests/postgres -m postgres --tb=short

      - name: Run PostgreSQL command tests from the installed wheel
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-postgres-wheel-XXXXXX")"
          wheel_dir="${isolated_root}/dist"
          venv_dir="${isolated_root}/venv"
          base_venv_dir="${isolated_root}/base-venv"
          test_root="${isolated_root}/tests-root"

          python -m pip install build
          python -m build --sdist --wheel --outdir "${wheel_dir}"
          python -m venv "${venv_dir}"
          python -m venv "${base_venv_dir}"

          wheels=("${wheel_dir}"/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one wheel in ${wheel_dir}" >&2
            exit 1
          fi
          sdists=("${wheel_dir}"/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 || ! -f "${sdists[0]}" ]]; then
            echo "Expected exactly one sdist in ${wheel_dir}" >&2
            exit 1
          fi
          "${venv_dir}/bin/python" -m pip install "${wheels[0]}[postgres]" pytest
          "${base_venv_dir}/bin/python" -m pip install "${wheels[0]}" pytest

          mkdir -p "${test_root}/tests/postgres"
          cp tests/__init__.py "${test_root}/tests/__init__.py"
          cp tests/postgres/__init__.py "${test_root}/tests/postgres/__init__.py"
          cp tests/postgres/conftest.py "${test_root}/tests/postgres/conftest.py"
          cp tests/postgres/test_postgres_state_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_state_commands_real.py"
          cp tests/postgres/test_postgres_state_command_concurrency_real.py \
            "${test_root}/tests/postgres/test_postgres_state_command_concurrency_real.py"
          cp tests/postgres/test_postgres_state_command_failures_real.py \
            "${test_root}/tests/postgres/test_postgres_state_command_failures_real.py"
          cp tests/postgres/test_postgres_recovery_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_recovery_commands_real.py"
          cp tests/postgres/test_postgres_ordinary_factory_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_ordinary_factory_commands_real.py"
          cp tests/postgres/test_postgres_openlineage_apply_real.py \
            "${test_root}/tests/postgres/test_postgres_openlineage_apply_real.py"
          cp tests/postgres/test_postgres_connector_removal_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_connector_removal_commands_real.py"
          cp tests/postgres/test_postgres_connector_recovery_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_connector_recovery_commands_real.py"
          cp tests/postgres/test_postgres_connector_removal_concurrency_real.py \
            "${test_root}/tests/postgres/test_postgres_connector_removal_concurrency_real.py"
          cp tests/postgres/test_postgres_connector_delete_404_recovery_real.py \
            "${test_root}/tests/postgres/test_postgres_connector_delete_404_recovery_real.py"
          cp tests/postgres/test_postgres_connector_recovery_mixed_real.py \
            "${test_root}/tests/postgres/test_postgres_connector_recovery_mixed_real.py"
          cp tests/postgres/test_postgres_connector_removal_process_contention_real.py \
            "${test_root}/tests/postgres/test_postgres_connector_removal_process_contention_real.py"
          cp tests/package/connector_removal_wheel_smoke.py \
            "${test_root}/connector_removal_wheel_smoke.py"

          cd "${test_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            "${venv_dir}/bin/python" -I - <<'PY'
          import os
          import sys
          from pathlib import Path

          import streamt

          checkout = Path(os.environ["STREAMT_CHECKOUT"]).resolve()
          checkout_source = checkout / "src"
          installed_module = Path(streamt.__file__).resolve()
          import_roots = {Path(entry).resolve() for entry in sys.path if entry}
          assert checkout_source not in import_roots, import_roots
          assert checkout not in installed_module.parents, installed_module
          PY
          env -u PYTHONPATH STREAMT_EXPECT_POSTGRES_EXTRA_MISSING=1 \
            "${base_venv_dir}/bin/python" -I -m pytest \
            tests/postgres/test_postgres_ordinary_factory_commands_real.py \
            -k base_wheel_without_postgres_extra -m postgres --tb=short
          env -u PYTHONPATH "${venv_dir}/bin/python" -I -m pytest \
            tests/postgres/test_postgres_state_commands_real.py \
            tests/postgres/test_postgres_state_command_concurrency_real.py \
            tests/postgres/test_postgres_state_command_failures_real.py \
            tests/postgres/test_postgres_recovery_commands_real.py \
            tests/postgres/test_postgres_ordinary_factory_commands_real.py \
            tests/postgres/test_postgres_openlineage_apply_real.py \
            tests/postgres/test_postgres_connector_removal_commands_real.py \
            tests/postgres/test_postgres_connector_recovery_commands_real.py \
            tests/postgres/test_postgres_connector_removal_concurrency_real.py \
            tests/postgres/test_postgres_connector_delete_404_recovery_real.py \
            tests/postgres/test_postgres_connector_recovery_mixed_real.py \
            tests/postgres/test_postgres_connector_removal_process_contention_real.py \
            -m postgres --tb=short
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            "${venv_dir}/bin/python" -I connector_removal_wheel_smoke.py

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Build distributions
        run: |
          python -m pip install --upgrade 'pip==26.2.1' 'build==1.6.0' 'twine==7.0.0'
          python -m build
          python -m twine check --strict dist/*

      - name: Upload exact release-candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/streamt-wheel-smoke
          /tmp/streamt-wheel-smoke/bin/pip install dist/*.whl
          /tmp/streamt-wheel-smoke/bin/streamt --help
          /tmp/streamt-wheel-smoke/bin/streamt adopt --help | grep -F connector
          /tmp/streamt-wheel-smoke/bin/streamt adopt --help | grep -F gateway_rule
          /tmp/streamt-wheel-smoke/bin/python -c 'from streamt.docs.asyncapi import generate_asyncapi_document; from streamt.core.models import StreamtProject; project = StreamtProject.model_validate({"apiVersion": "streamt.dev/v1alpha1", "project": {"name": "wheel-smoke"}, "runtime": {"kafka": {"bootstrap_servers": "localhost:9092"}}, "sources": [{"name": "events", "topic": "events"}]}); assert generate_asyncapi_document(project)["asyncapi"] == "3.1.0"'

      - name: Verify OpenLineage schemas in wheel and source distribution
        shell: bash
        env:
          STREAMT_TEST_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          /tmp/streamt-wheel-smoke/bin/pip install pytest
          cd /tmp
          env -u PYTHONPATH /tmp/streamt-wheel-smoke/bin/python -I -m pytest \
            "${GITHUB_WORKSPACE}/tests/unit/test_openlineage_validation.py::test_built_wheel_and_source_distribution_contain_openlineage_resources" \
            --tb=short

      - name: Verify source, installed, CLI, and distribution versions agree
        shell: bash
        env:
          STREAMT_TEST_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          cd /tmp
          env -u PYTHONPATH /tmp/streamt-wheel-smoke/bin/python -I -m pytest \
            "${GITHUB_WORKSPACE}/tests/unit/test_version_coherence.py" \
            --tb=short

      - name: Verify Backstage schemas in wheel and source distribution
        timeout-minutes: 3
        shell: bash
        env:
          STREAMT_TEST_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          cd /tmp
          env -u PYTHONPATH /tmp/streamt-wheel-smoke/bin/python -I -m pytest \
            "${GITHUB_WORKSPACE}/tests/unit/test_backstage_validation.py::test_built_wheel_and_source_distribution_contain_backstage_resources" \
            --tb=short

      - name: Smoke-test installed ODCS export offline
        run: |
          cd /tmp
          /tmp/streamt-wheel-smoke/bin/python - <<'PY'
          import socket
          import tempfile
          from pathlib import Path

          import yaml
          from click.testing import CliRunner

          def fail_network(*_args: object, **_kwargs: object) -> None:
              raise AssertionError("installed ODCS export attempted network access")

          socket.getaddrinfo = fail_network
          socket.create_connection = fail_network

          from streamt.cli import main
          from streamt.docs.odcs import _official_schema, validate_odcs_document

          schema = _official_schema()
          assert schema["$schema"] == "https://json-schema.org/draft/2019-09/schema"

          project_dir = Path(tempfile.mkdtemp(prefix="streamt-odcs-wheel-"))
          (project_dir / "stream_project.yml").write_text(
              yaml.safe_dump(
                  {
                      "apiVersion": "streamt.dev/v1alpha1",
                      "project": {"name": "wheel-smoke", "version": "1.0.0"},
                      "runtime": {
                          "kafka": {
                              "bootstrap_servers": "offline.invalid:9092",
                          }
                      },
                      "sources": [
                          {
                              "name": "events",
                              "topic": "events.v1",
                              "columns": [
                                  {"name": "id", "type": "BIGINT", "required": True}
                              ],
                          }
                      ],
                  },
                  sort_keys=False,
              ),
              encoding="utf-8",
          )
          result = CliRunner().invoke(
              main,
              [
                  "docs",
                  "odcs",
                  "--project-dir",
                  str(project_dir),
                  "--contract-id",
                  "urn:streamt:wheel-smoke",
                  "--status",
                  "draft",
              ],
              catch_exceptions=False,
          )
          assert result.exit_code == 0, result.output
          document = yaml.safe_load(result.stdout)
          assert document["apiVersion"] == "v3.1.0"
          assert document["id"] == "urn:streamt:wheel-smoke"
          assert "offline.invalid" not in result.stdout
          validate_odcs_document(document)
          PY

      - name: Smoke-test installed Gateway removal workflow
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-gateway-wheel-XXXXXX")"
          cp tests/package/gateway_removal_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            /tmp/streamt-wheel-smoke/bin/python -I gateway_removal_wheel_smoke.py

      - name: Smoke-test installed Gateway adoption workflow
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-gateway-adopt-wheel-XXXXXX")"
          cp tests/package/gateway_adoption_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            /tmp/streamt-wheel-smoke/bin/python -I gateway_adoption_wheel_smoke.py

      - name: Smoke-test installed durable OpenLineage apply telemetry
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-openlineage-apply-wheel-XXXXXX")"
          cp tests/package/openlineage_apply_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            /tmp/streamt-wheel-smoke/bin/python -I openlineage_apply_wheel_smoke.py

      - name: Smoke-test installed Backstage catalog export offline
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-backstage-wheel-XXXXXX")"
          source_baseline_path="${RUNNER_TEMP}/streamt-backstage-catalog-source.yaml"
          parity_path="${RUNNER_TEMP}/streamt-backstage-catalog-parity.yaml"
          cp tests/package/backstage_catalog_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env \
            PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_BACKSTAGE_SOURCE_BASELINE_PATH="${source_baseline_path}" \
            STREAMT_BACKSTAGE_SOURCE_MODE=1 \
            /tmp/streamt-wheel-smoke/bin/python backstage_catalog_wheel_smoke.py
          env -u PYTHONPATH \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_BACKSTAGE_SOURCE_BASELINE_PATH="${source_baseline_path}" \
            STREAMT_BACKSTAGE_PARITY_PATH="${parity_path}" \
            /tmp/streamt-wheel-smoke/bin/python -I backstage_catalog_wheel_smoke.py
          printf 'STREAMT_BACKSTAGE_PARITY_PATH=%s\n' "${parity_path}" >> "${GITHUB_ENV}"

      - name: Setup Node.js for Backstage release parity
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate installed-wheel Backstage YAML with pinned Node packages
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          test -s "${STREAMT_BACKSTAGE_PARITY_PATH}"
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/streamt-backstage-node-XXXXXX")"
          npm install \
            --prefix "${audit_dir}" \
            --ignore-scripts \
            --no-save \
            --package-lock=false \
            @backstage/catalog-model@1.10.0 \
            yaml@2.8.1
          cp tests/package/backstage_catalog_node_validate.cjs "${audit_dir}/validate.cjs"
          cd "${audit_dir}"
          validator_output="$(node validate.cjs < "${STREAMT_BACKSTAGE_PARITY_PATH}")"
          test -z "${validator_output}"

      - name: Smoke-test installed DataHub catalog export offline
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-datahub-wheel-XXXXXX")"
          baseline_dir="${RUNNER_TEMP}/streamt-datahub-source-baselines"
          artifact_dir="${RUNNER_TEMP}/streamt-datahub-mcp-artifacts"
          mkdir -p "${baseline_dir}" "${artifact_dir}"
          cp tests/package/datahub_catalog_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env \
            PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_DATAHUB_BASELINE_DIR="${baseline_dir}" \
            STREAMT_DISTRIBUTIONS_DIR="${GITHUB_WORKSPACE}/dist" \
            STREAMT_DATAHUB_SOURCE_MODE=1 \
            /tmp/streamt-wheel-smoke/bin/python datahub_catalog_wheel_smoke.py
          env -u PYTHONPATH \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_DATAHUB_BASELINE_DIR="${baseline_dir}" \
            STREAMT_DATAHUB_ARTIFACT_DIR="${artifact_dir}" \
            /tmp/streamt-wheel-smoke/bin/python -I datahub_catalog_wheel_smoke.py
          test -s "${artifact_dir}/with-instance.json"
          test -s "${artifact_dir}/without-kafka-instance.json"
          printf 'STREAMT_DATAHUB_ARTIFACT_DIR=%s\n' "${artifact_dir}" >> "${GITHUB_ENV}"

      - name: Upload DataHub MCP oracle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datahub-catalog-mcp-artifacts
          path: ${{ env.STREAMT_DATAHUB_ARTIFACT_DIR }}/
          if-no-files-found: error

      - name: Upload wheel for DataHub compatibility matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datahub-streamt-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload Python 3.10 DataHub source baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datahub-catalog-source-baselines
          path: ${{ runner.temp }}/streamt-datahub-source-baselines/
          if-no-files-found: error

      - name: Smoke-test installed PostgreSQL extra
        run: |
          python -m venv /tmp/streamt-postgres-wheel-smoke
          python - <<'PY'
          import glob
          import subprocess

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          subprocess.check_call(
              [
                  "/tmp/streamt-postgres-wheel-smoke/bin/pip",
                  "install",
                  f"{wheels[0]}[postgres]",
              ]
          )
          PY
          cd /tmp
          /tmp/streamt-postgres-wheel-smoke/bin/python -c 'import psycopg; from streamt.deployer.postgres_state import PostgresStateAdministration; assert psycopg.__version__'

  kafka-streams-installed-journey:
    name: Kafka Streams installed topology (client ${{ matrix.kafka-client }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kafka-client: ['2.13.2', '2.15.0']

    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download exact candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist/

      - name: Install outside the checkout and build the packaged runner
        shell: bash
        env:
          KAFKA_CLIENT_VERSION: ${{ matrix.kafka-client }}
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          [[ ${#wheels[@]} -eq 1 && -f "${wheels[0]}" ]]
          lane_root="${RUNNER_TEMP}/streamt-kafka-streams-installed"
          python -m venv "${lane_root}/venv"
          "${lane_root}/venv/bin/pip" install "${wheels[0]}" "confluent-kafka==${KAFKA_CLIENT_VERSION}"
          "${lane_root}/venv/bin/pip" check
          cp tests/package/kafka_streams_journey.py "${lane_root}/kafka_streams_journey.py"
          cp tests/package/kafka_streams_replacement_probe.py "${lane_root}/kafka_streams_replacement_probe.py"
          cd "${lane_root}"
          "${lane_root}/venv/bin/python" -I -m streamt -o json runtime build --dry-run > build-inputs.json
          "${lane_root}/venv/bin/python" -I -m streamt -o json runtime build --timeout 900 > build-result.json

      - name: Prove existing import and fresh init through real CLI create and no-op
        shell: bash
        run: |
          set -euo pipefail
          lane_root="${RUNNER_TEMP}/streamt-kafka-streams-installed"
          docker pull apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          image_id=$("${lane_root}/venv/bin/python" -I -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["data"]["image"])' \
            "${lane_root}/build-result.json")
          cd "${lane_root}"
          "${lane_root}/venv/bin/python" -I kafka_streams_journey.py \
            --checkout "${GITHUB_WORKSPACE}" --mode installed --image "${image_id}" \
            --evidence-dir "${lane_root}/evidence"

      - name: Prove read-only clean-close evidence and refuse renamed generations
        shell: bash
        run: |
          set -euo pipefail
          lane_root="${RUNNER_TEMP}/streamt-kafka-streams-installed"
          image_id=$("${lane_root}/venv/bin/python" -I -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["data"]["image"])' \
            "${lane_root}/build-result.json")
          cd "${lane_root}"
          "${lane_root}/venv/bin/python" -I kafka_streams_replacement_probe.py \
            --checkout "${GITHUB_WORKSPACE}" --mode installed --image "${image_id}" \
            --evidence-dir "${lane_root}/evidence"

      - name: Retain exact installed topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kafka-streams-installed-${{ matrix.kafka-client }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/streamt-kafka-streams-installed/build-*.json
            ${{ runner.temp }}/streamt-kafka-streams-installed/evidence/**/evidence.json
            ${{ runner.temp }}/streamt-kafka-streams-installed/evidence/**/command-*.stdout
            ${{ runner.temp }}/streamt-kafka-streams-installed/evidence/**/command-*.stderr
          if-no-files-found: warn
          retention-days: 14

  strimzi-package-parity:
    name: Strimzi package parity (Python ${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact release-candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist/

      - name: Verify source, wheel, and direct-sdist Strimzi parity
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          wheels=(dist/*.whl)
          source_distributions=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one wheel" >&2
            exit 1
          fi
          if [[ ${#source_distributions[@]} -ne 1 || ! -f "${source_distributions[0]}" ]]; then
            echo "Expected exactly one source distribution" >&2
            exit 1
          fi
          python tests/package/strimzi_package_smoke.py \
            --wheel "${wheels[0]}" \
            --sdist "${source_distributions[0]}" \
            --source-root "${GITHUB_WORKSPACE}"

  strimzi-real-acceptance:
    name: Strimzi 1.2.0 real KafkaTopic acceptance
    needs: [package, strimzi-package-parity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download exact release-candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/streamt-strimzi-wheel

      - name: Install standalone gate dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3'

      - name: Self-test standalone gate
        run: python -I tests/integration/strimzi_gate.py --self-test

      - name: Run and validate real Strimzi acceptance
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/streamt-strimzi-wheel"
          candidate="${RUNNER_TEMP}/streamt-strimzi-evidence-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upload="${RUNNER_TEMP}/streamt-strimzi-evidence-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mapfile -d '' -t artifacts < <(
            find "${artifact_dir}" -mindepth 1 -maxdepth 1 -print0
          )
          mapfile -d '' -t wheels < <(
            find "${artifact_dir}" -mindepth 1 -maxdepth 1 -type f -name '*.whl' -print0
          )
          mapfile -d '' -t source_distributions < <(
            find "${artifact_dir}" -mindepth 1 -maxdepth 1 -type f -name '*.tar.gz' -print0
          )
          if (( ${#artifacts[@]} != 2 || ${#wheels[@]} != 1 || ${#source_distributions[@]} != 1 )); then
            echo "Expected exactly one regular wheel and one regular source distribution" >&2
            exit 1
          fi
          if [[ -L "${wheels[0]}" || -L "${source_distributions[0]}" ]]; then
            echo "Distribution artifacts must not be symbolic links" >&2
            exit 1
          fi
          wheel="$(realpath -- "${wheels[0]}")"

          if [[ -e "${candidate}" || -L "${candidate}" || -e "${upload}" || -L "${upload}" ]]; then
            echo "Strimzi evidence paths must start absent" >&2
