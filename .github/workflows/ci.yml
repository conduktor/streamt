              raise ValueError(f"non-finite JSON number: {value}")

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          expected_lock_sha256 = (
              "739a1eb624a0f0dbf4775c93fc7152f0280e153251f8de6b274dc2330ef3b7d0"
          )
          if hashlib.sha256(raw).hexdigest() != expected_lock_sha256:
              raise SystemExit("images.lock.json bytes are not the reviewed acceptance lock")
          try:
              lock = json.loads(
