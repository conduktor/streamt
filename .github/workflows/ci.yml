                          "config": (
                              "sha256:ba984c01faaf5b9d9ccc2aeba9ec7e2177a970caec767dfa477b8d8a94df98f3"
                          ),
                          "kubernetes_image_id": (
                              "quay.io/strimzi/kafka@"
                              "sha256:1699c345852618c02ed58a168923871ad3a4d9012e4181ecaa138c9bc55a8b6d"
                          ),
                      },
                      "linux/arm64": {
                          "manifest": (
                              "sha256:ffba1669b6daa7e186a17b0c49b48f4dfd8ef5872720e0eec9bf7c4612dd1bcb"
                          ),
                          "config": (
                              "sha256:5f6ad7b02f27af240676afddbe36b63c419bc4cdfcf1b012db989b6d4fc4f684"
                          ),
                          "kubernetes_image_id": (
                              "quay.io/strimzi/kafka@"
                              "sha256:ffba1669b6daa7e186a17b0c49b48f4dfd8ef5872720e0eec9bf7c4612dd1bcb"
                          ),
                      },
                  },
              },
          }
          try:
              selected_images = {
                  name: lock["images"][name] for name in ("operator", "kafka")
              }
          except (KeyError, TypeError) as error:
              raise SystemExit("images.lock.json image closure is absent") from error
          if selected_images != expected_images:
              raise SystemExit("images.lock.json image closure is not exact")
          for image in ("operator", "kafka"):
              for platform in ("linux/amd64", "linux/arm64"):
                  runtime_id = lock["images"][image]["platforms"][platform][
                      "kubernetes_image_id"
                  ]
                  expected_runtime_id = expected_images[image]["platforms"][platform][
                      "kubernetes_image_id"
                  ]
                  if runtime_id != expected_runtime_id:
                      raise SystemExit(f"{image} {platform} runtime imageID is not exact")
          PY

          python -I \
            "${GITHUB_WORKSPACE}/tests/integration/strimzi_gate.py" \
            --wheel "${wheel}" \
            --evidence-candidate "${candidate}" \
            --evidence-upload "${upload}"

          if [[ -e "${candidate}" || -L "${candidate}" ]]; then
            echo "Strimzi evidence candidate was not removed" >&2
            exit 1
          fi
          if [[ ! -d "${upload}" || -L "${upload}" ]]; then
            echo "Strimzi evidence upload is not a real directory" >&2
            exit 1
          fi

          python -I - "${upload}" "${wheel}" <<'PY'
          import hashlib
          import json
          import re
          import stat
          import sys
          from pathlib import Path

          upload = Path(sys.argv[1])
          wheel = Path(sys.argv[2])

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON key")
                  value[key] = item
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def read_json(name):
              raw = (upload / name).read_bytes()
              if len(raw) > 2 * 1024 * 1024:
                  raise SystemExit(f"{name} exceeded the evidence file bound")
              try:
                  value = json.loads(
                      raw,
                      object_pairs_hook=reject_duplicates,
                      parse_constant=reject_constant,
                  )
              except (UnicodeError, ValueError) as error:
                  raise SystemExit(f"{name} is not strict JSON") from error
              return raw, value

          expected_files = {
              "broker-0-configs.txt",
              "broker-0-describe.txt",
              "broker-1-configs.txt",
              "broker-1-describe.txt",
              "cleanup.json",
              "ctr-images.txt",
              "ctr-load-0-after.txt",
              "ctr-load-0-before.txt",
              "ctr-load-0-config.json",
              "ctr-load-0-import-0.json",
              "ctr-load-0-import-1.json",
              "ctr-load-1-after.txt",
              "ctr-load-1-before.txt",
              "ctr-load-1-config.json",
              "ctr-load-1-import-0.json",
              "ctr-load-1-import-1.json",
              "events.json",
              "generated-checksums.json",
              "kafka-version.txt",
              "kafkatopic-crd-sha256.json",
              "kafkatopic-crd.json",
              "kubernetes-version.json",
              "node-image.json",
              "nodes.json",
              "operator-deployment.json",
              "operator.log",
              "strimzi-resources.json",
              "summary.json",
              "timeline.json",
              "topic-first.json",
              "topic-operator.log",
              "topic-replay.json",
              "workload-pods.json",
          }
          if stat.S_IMODE(upload.stat().st_mode) != 0o700:
              raise SystemExit("Strimzi upload directory mode changed")
          actual_files = set()
          for artifact in upload.iterdir():
              mode = artifact.lstat().st_mode
              if artifact.is_symlink() or not stat.S_ISREG(mode):
                  raise SystemExit("Strimzi evidence contains a non-regular file")
              if stat.S_IMODE(mode) != 0o444:
                  raise SystemExit(f"{artifact.name} mode changed")
              actual_files.add(artifact.name)
          if actual_files != expected_files:
              raise SystemExit("Strimzi evidence artifact closure changed")

          expected_summary_bytes = (
              b'{"failure_code":null,"platform":"linux/amd64",'
              b'"release":"1.2.0","status":"passed"}\n'
          )
          summary_raw, summary = read_json("summary.json")
          expected_summary = {
              "failure_code": None,
              "platform": "linux/amd64",
              "release": "1.2.0",
              "status": "passed",
          }
          if summary != expected_summary or summary_raw != expected_summary_bytes:
              raise SystemExit("Strimzi summary.json did not match the exact passing contract")

          expected_cleanup = (
              b'{"cluster_delete_returncode":0,"network_remove_returncode":0,'
              b'"node_remove_returncode":0,"residue_containers":[],'
              b'"residue_networks":[]}\n'
          )
          if (upload / "cleanup.json").read_bytes() != expected_cleanup:
              raise SystemExit("Strimzi cleanup was not exact and residue-free")

          if (upload / "kafka-version.txt").read_bytes() != b"4.3.1\n":
              raise SystemExit("Strimzi Kafka runtime version evidence changed")

          _timeline_raw, timeline = read_json("timeline.json")
          expected_phases = [
              "downloads-verified",
              "image-chains-verified",
              "offline-export-verified",
              "isolated-bridge-created",
              "kind-created",
              "node-isolation-verified",
              "node-image-store-verified",
              "operator-ready",
              "kafka-ready",
              "workload-images-verified",
              "kafka-version-verified",
              "topics-ready",
              "replay-verified",
              "node-isolation-reverified",
              "cleanup-complete",
          ]
          if not isinstance(timeline, list) or len(timeline) != len(expected_phases):
              raise SystemExit("Strimzi timeline coverage changed")
          elapsed = []
          for entry, expected_phase in zip(timeline, expected_phases, strict=True):
              if not isinstance(entry, dict) or set(entry) != {"elapsed_ms", "phase"}:
                  raise SystemExit("Strimzi timeline entry shape changed")
              value = entry["elapsed_ms"]
              if type(value) is not int or value < 0 or entry["phase"] != expected_phase:
                  raise SystemExit("Strimzi timeline ordering or timing changed")
              elapsed.append(value)
          if elapsed != sorted(elapsed):
              raise SystemExit("Strimzi timeline is not monotonic")

          operator_child = (
              "quay.io/strimzi/operator@"
              "sha256:6df3bf9f92d3d1907aca08ade8c6df6cdacd2e235756afad419ad582ce6a2c4e"
          )
          kafka_child = (
              "quay.io/strimzi/kafka@"
              "sha256:1699c345852618c02ed58a168923871ad3a4d9012e4181ecaa138c9bc55a8b6d"
          )
          expected_images = {
              operator_child: (
                  "sha256:307ebd6e0fd9121e0775b1cf0f06a5658cece38c58d46082512b910a7d095ce3",
                  operator_child,
              ),
              kafka_child: (
                  "sha256:ba984c01faaf5b9d9ccc2aeba9ec7e2177a970caec767dfa477b8d8a94df98f3",
                  kafka_child,
              ),
          }
          _pods_raw, pods = read_json("workload-pods.json")
          if (
              not isinstance(pods, dict)
              or set(pods) != {"apiVersion", "kind", "metadata", "items"}
              or pods["apiVersion"] != "v1"
              or pods["kind"] != "List"
              or pods["metadata"] != {"resourceVersion": ""}
              or not isinstance(pods["items"], list)
              or not pods["items"]
          ):
              raise SystemExit("Strimzi workload Pod collection shape changed")
          image_counts = dict.fromkeys(expected_images, 0)
          for pod in pods["items"]:
              if (
                  not isinstance(pod, dict)
                  or pod.get("apiVersion") != "v1"
                  or pod.get("kind") != "Pod"
                  or not isinstance(pod.get("spec"), dict)
                  or not isinstance(pod.get("status"), dict)
              ):
                  raise SystemExit("Strimzi workload Pod identity changed")
              for specification_key, status_key in (
                  ("initContainers", "initContainerStatuses"),
                  ("containers", "containerStatuses"),
              ):
                  specifications = pod["spec"].get(specification_key, [])
                  statuses = pod["status"].get(status_key, [])
                  if not isinstance(specifications, list) or not isinstance(statuses, list):
                      raise SystemExit("Strimzi workload container collection changed")
                  expected_statuses = {}
                  for container in specifications:
                      if (
                          not isinstance(container, dict)
                          or not isinstance(container.get("name"), str)
                          or not isinstance(container.get("image"), str)
                          or container["name"] in expected_statuses
                          or container["image"] not in expected_images
                      ):
                          raise SystemExit("Strimzi workload spec image closure changed")
                      expected_statuses[container["name"]] = container["image"]
                  observed_statuses = {}
                  for status_value in statuses:
                      if (
                          not isinstance(status_value, dict)
                          or not isinstance(status_value.get("name"), str)
                          or status_value["name"] in observed_statuses
                      ):
                          raise SystemExit("Strimzi workload status coverage changed")
                      observed_statuses[status_value["name"]] = status_value
                  if set(observed_statuses) != set(expected_statuses):
                      raise SystemExit("Strimzi workload status coverage changed")
                  for name, reference in expected_statuses.items():
                      config_digest, runtime_id = expected_images[reference]
                      status_value = observed_statuses[name]
                      if status_value.get("image") not in {reference, config_digest}:
                          raise SystemExit("Strimzi workload status image closure changed")
                      if status_value.get("imageID") != runtime_id:
                          raise SystemExit("Strimzi workload runtime imageID changed")
                      image_counts[reference] += 1
          if not all(count > 0 for count in image_counts.values()):
              raise SystemExit("Strimzi workload image coverage is incomplete")
          if (upload / "pilot-image-ids.json").exists():
              raise SystemExit("Normal Strimzi evidence contains a pilot imageID artifact")

          _checksums_raw, checksums = read_json("generated-checksums.json")
          if not isinstance(checksums, dict) or set(checksums) != {
              "export_sha256",
              "fixtures",
              "kafka_manifest_sha256",
              "operator_manifest_sha256",
              "wheel_sha256",
          }:
              raise SystemExit("generated checksum evidence shape changed")
          expected_fixture_hashes = {
              "contract.json": (
                  "9e9a2aeb47a58a2a09f10d79c61b85c69eaa5e824194327ff6b0adffa2af3917"
              ),
              "images.lock.json": (
                  "739a1eb624a0f0dbf4775c93fc7152f0280e153251f8de6b274dc2330ef3b7d0"
              ),
              "kafka.yaml": (
                  "f33e0b3255aaf1257603a981de79a51b8afc6882e58023841da1c5028770b445"
              ),
              "kind.yaml": (
                  "3c1649c94e244ede76e3631d2b08656c3ad8a9e23b26a8d98f8174a55a0c4575"
              ),
              "operator-contract.json": (
                  "7f9343e9aa04f70d91a39a4bf8db0ac6245810d1e2ac3e68309ef2014af19094"
              ),
              "stream_project.yml": (
                  "fb3b4758b007125b1f7997a2f283d43b30312ac09bec52863c54de21aa1ebdbc"
              ),
          }
          if checksums["fixtures"] != expected_fixture_hashes:
              raise SystemExit("generated fixture checksums changed")
          with wheel.open("rb") as stream:
              wheel_sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
          if checksums["wheel_sha256"] != wheel_sha256:
              raise SystemExit("generated wheel checksum does not match the exact artifact")
          digest = re.compile(r"^[0-9a-f]{64}$")
          for name in ("export_sha256", "kafka_manifest_sha256", "operator_manifest_sha256"):
              if not isinstance(checksums[name], str) or digest.fullmatch(checksums[name]) is None:
                  raise SystemExit(f"{name} is not an exact SHA-256")
          PY

      - name: Upload only scanned Strimzi evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: strimzi-1.2.0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/streamt-strimzi-evidence-upload-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

  datahub-release-oracle:
    name: DataHub 1.7.0 oracle (Python ${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built streamt wheel
        uses: actions/download-artifact@v8
        with:
          name: datahub-streamt-wheel
          path: ${{ runner.temp }}/streamt-datahub-wheel

      - name: Download Python 3.10 source baselines
        uses: actions/download-artifact@v8
        with:
          name: datahub-catalog-source-baselines
          path: ${{ runner.temp }}/streamt-datahub-source-baselines

      - name: Download Python 3.10 installed-wheel reference artifacts
        uses: actions/download-artifact@v8
        with:
          name: datahub-catalog-mcp-artifacts
          path: ${{ runner.temp }}/streamt-datahub-reference-artifacts

      - name: Re-run installed-wheel parity without DataHub
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-datahub-lane-XXXXXX")"
          wheel_venv="${isolated_root}/wheel-venv"
          run_dir="${isolated_root}/run"
          artifact_dir="${isolated_root}/artifacts"
          mkdir -p "${run_dir}" "${artifact_dir}"
          wheels=("${RUNNER_TEMP}/streamt-datahub-wheel"/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one downloaded streamt wheel" >&2
            exit 1
          fi

          python -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install --upgrade pip
          "${wheel_venv}/bin/python" -m pip install --progress-bar off "${wheels[0]}"
          "${wheel_venv}/bin/python" -m pip check
          cp tests/package/datahub_catalog_wheel_smoke.py "${run_dir}/"
          cd "${run_dir}"
          env -u PYTHONPATH \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_DATAHUB_BASELINE_DIR="${RUNNER_TEMP}/streamt-datahub-source-baselines" \
            STREAMT_DATAHUB_ARTIFACT_DIR="${artifact_dir}" \
            "${wheel_venv}/bin/python" -I datahub_catalog_wheel_smoke.py

          cmp "${artifact_dir}/with-instance.json" \
            "${RUNNER_TEMP}/streamt-datahub-reference-artifacts/with-instance.json"
          cmp "${artifact_dir}/without-kafka-instance.json" \
            "${RUNNER_TEMP}/streamt-datahub-reference-artifacts/without-kafka-instance.json"
          printf 'STREAMT_DATAHUB_LANE_ARTIFACT_DIR=%s\n' "${artifact_dir}" >> "${GITHUB_ENV}"

      - name: Validate lane artifacts with exact official DataHub release
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          oracle_root="$(mktemp -d "${RUNNER_TEMP}/streamt-datahub-oracle-XXXXXX")"
          oracle_venv="${oracle_root}/venv"
          python -m venv "${oracle_venv}"
          "${oracle_venv}/bin/python" -m pip install --upgrade pip
          "${oracle_venv}/bin/python" -m pip install \
            --progress-bar off 'acryl-datahub==1.7.0'
          "${oracle_venv}/bin/python" -m pip check
          "${oracle_venv}/bin/python" \
            tests/package/datahub_catalog_v170_oracle.py --self-test
          "${oracle_venv}/bin/python" \
            tests/package/datahub_catalog_v170_oracle.py \
            --artifact "${STREAMT_DATAHUB_LANE_ARTIFACT_DIR}/with-instance.json"
          "${oracle_venv}/bin/python" \
            tests/package/datahub_catalog_v170_oracle.py \
            --artifact "${STREAMT_DATAHUB_LANE_ARTIFACT_DIR}/without-kafka-instance.json"

  datahub-gms-v170:
    name: DataHub v1.7.0 real GMS acceptance
    needs: [package, datahub-release-oracle]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATAHUB_COMPOSE_FILE: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/upstream-compose.yml
      DATAHUB_COMPOSE_OVERRIDE: ${{ github.workspace }}/tests/integration/datahub/v1.7.0/docker-compose.override.yml
      DATAHUB_ENV_FILE: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/compose.env
      DATAHUB_EVIDENCE_DIR: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/evidence
      DATAHUB_STREAMT_VENV: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/streamt-venv
      DATAHUB_CLI_VENV: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/datahub-venv

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Download exact built streamt wheel
        uses: actions/download-artifact@v8
        with:
          name: datahub-streamt-wheel
          path: ${{ runner.temp }}/datahub-gms-v170/wheel

      - name: Prepare isolated installed-package environments
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${DATAHUB_EVIDENCE_DIR}"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/datahub-gms-v170/wheel" \
            -maxdepth 1 -type f -name '*.whl' -print)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one downloaded streamt wheel" >&2
            exit 1
          fi
          if [[ $(find "${RUNNER_TEMP}/datahub-gms-v170/wheel" \
            -maxdepth 1 -type f | wc -l) -ne 1 ]]; then
            echo "Downloaded wheel artifact contains unexpected files" >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          test -s "${wheel}"
          sha256sum "${wheel}" > "${DATAHUB_EVIDENCE_DIR}/streamt-wheel.sha256"

          python -m venv "${DATAHUB_STREAMT_VENV}"
          "${DATAHUB_STREAMT_VENV}/bin/python" -m pip install --upgrade pip
          "${DATAHUB_STREAMT_VENV}/bin/python" -m pip install \
            --progress-bar off "${wheel}"
          "${DATAHUB_STREAMT_VENV}/bin/python" -m pip check
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            "${DATAHUB_STREAMT_VENV}/bin/python" -I - <<'PY'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          import streamt

          checkout = Path(os.environ["STREAMT_CHECKOUT"]).resolve()
          installed_module = Path(streamt.__file__).resolve()
          import_roots = {Path(entry).resolve() for entry in sys.path if entry}
          assert checkout not in installed_module.parents, installed_module
          assert checkout / "src" not in import_roots, import_roots
          assert importlib.util.find_spec("datahub") is None
          PY

          python -m venv "${DATAHUB_CLI_VENV}"
          "${DATAHUB_CLI_VENV}/bin/python" -m pip install --upgrade pip
          "${DATAHUB_CLI_VENV}/bin/python" -m pip install \
            --progress-bar off 'acryl-datahub==1.7.0'
          "${DATAHUB_CLI_VENV}/bin/python" -m pip check
          env -u PYTHONPATH "${DATAHUB_CLI_VENV}/bin/python" -I - <<'PY'
          import importlib.metadata
          import importlib.util

          assert importlib.metadata.version("acryl-datahub") == "1.7.0"
          assert importlib.util.find_spec("streamt") is None
          PY

      - name: Preflight and lock the official DataHub Compose file
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -m)" = "x86_64"
          docker version >/dev/null
          compose_version="$(docker compose version --short | sed 's/^v//')"
          if [[ "$(printf '2.24.4\n%s\n' "${compose_version}" | sort -V | head -n 1)" != "2.24.4" ]]; then
            echo "Docker Compose 2.24.4 or newer is required" >&2
            exit 1
          fi
          available_memory_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          available_disk_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 {print $4}')"
          if (( available_memory_kib < 8 * 1024 * 1024 )); then
            echo "DataHub gate requires at least 8 GiB available memory" >&2
            exit 1
          fi
          if (( available_disk_kib < 13 * 1024 * 1024 )); then
            echo "DataHub gate requires at least 13 GiB available disk" >&2
            exit 1
          fi
          {
            uname -m
            docker version --format '{{.Server.Version}}'
            docker compose version
            awk '/^MemAvailable:/ {print}' /proc/meminfo
            df -Pk "${RUNNER_TEMP}"
          } > "${DATAHUB_EVIDENCE_DIR}/preflight.txt"

          mkdir -p "$(dirname "${DATAHUB_COMPOSE_FILE}")"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "${DATAHUB_COMPOSE_FILE}" \
            https://raw.githubusercontent.com/datahub-project/datahub/7f81ccbfe27b9acc947f5f600fcf9ddb72138a80/docker/quickstart/docker-compose.quickstart-profile.yml
          printf '%s  %s\n' \
            ec476d12f6f278c50d657a617357a050510565ef00b570a69cbe9123a932a7b7 \
            "${DATAHUB_COMPOSE_FILE}" | sha256sum --check --strict
          test -s "${DATAHUB_COMPOSE_OVERRIDE}"

          signing_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          signing_salt="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          mysql_password="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::${signing_key}"
          echo "::add-mask::${signing_salt}"
          echo "::add-mask::${mysql_password}"
          umask 077
          {
            printf 'DATAHUB_VERSION=v1.7.0\n'
            printf 'UI_INGESTION_DEFAULT_CLI_VERSION=1.7.0\n'
            printf 'DATAHUB_TELEMETRY_ENABLED=false\n'
            printf 'DATAHUB_TOKEN_SERVICE_SIGNING_KEY=%s\n' "${signing_key}"
            printf 'DATAHUB_TOKEN_SERVICE_SALT=%s\n' "${signing_salt}"
            printf 'DATAHUB_MYSQL_PASSWORD=%s\n' "${mysql_password}"
          } > "${DATAHUB_ENV_FILE}"

          COMPOSE_PROJECT_NAME="dh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-check" \
          DATAHUB_MAPPED_GMS_PORT=18080 \
            docker compose --env-file "${DATAHUB_ENV_FILE}" \
              -f "${DATAHUB_COMPOSE_FILE}" \
              -f "${DATAHUB_COMPOSE_OVERRIDE}" config --quiet
          printf '%s\n' \
            'commit=7f81ccbfe27b9acc947f5f600fcf9ddb72138a80' \
            'compose_sha256=ec476d12f6f278c50d657a617357a050510565ef00b570a69cbe9123a932a7b7' \
            > "${DATAHUB_EVIDENCE_DIR}/upstream-lock.txt"

      - name: Pull exact DataHub v1.7.0 dependency closure
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          images=(
            'acryldata/datahub-gms:v1.7.0@sha256:54bc4431402846a72d1c1bdb69fae1148f74a59425144aa947fdf1c3506461f7'
            'acryldata/datahub-upgrade:v1.7.0@sha256:21e77ad964be64b2b5a7f74c9685897ed79e8854995242eaa5e5c426395b88c0'
            'confluentinc/cp-kafka:8.2.2@sha256:8e01c0305844d6c05bfb8e86479f5f363bb6a53497625395943a9da780de67ce'
            'mysql:8.2@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1'
            'opensearchproject/opensearch:2.19.3@sha256:e96cc6ae1500a073d973c0906f30f7cf4d9c461f32f855f9242a2da933660cdd'
          )
          printf '%s\n' "${images[@]}" > "${DATAHUB_EVIDENCE_DIR}/locked-images.txt"
          for image in "${images[@]}"; do
            docker pull --platform linux/amd64 "${image}"
            docker image inspect --format '{{.Id}}' "${image}" \
              >> "${DATAHUB_EVIDENCE_DIR}/pulled-image-ids.txt"
          done

      - name: Run both fresh real-GMS variants
        timeout-minutes: 35
        shell: bash
        run: |
          set -uo pipefail

          overall_status=0
          run_variant() {
            local variant="$1"
            local suffix="$2"
            local port="$3"
            local project="dh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}"
            local evidence="${DATAHUB_EVIDENCE_DIR}/${variant}"
            local status=0
            local cleanup_status=0
            mkdir -p "${evidence}"
            printf '{"status":"not_run","variant":"%s"}\n' "${variant}" \
              > "${evidence}/gate-summary.json"

            compose_bounded() {
              local duration="$1"
              shift
              timeout --foreground --signal=TERM --kill-after=20s "${duration}" \
                env COMPOSE_PROJECT_NAME="${project}" DATAHUB_MAPPED_GMS_PORT="${port}" \
                docker compose --ansi never --progress plain \
                  --env-file "${DATAHUB_ENV_FILE}" \
                  -f "${DATAHUB_COMPOSE_FILE}" \
                  -f "${DATAHUB_COMPOSE_OVERRIDE}" \
                  -p "${project}" --profile quickstart-backend "$@"
            }

            if ! compose_bounded 8m up -d --no-build --pull never \
              datahub-gms-quickstart; then
              status=1
            fi
            if (( status == 0 )); then
              published_port="$(
                compose_bounded 20s port datahub-gms-quickstart 8080 \
                  2> "${evidence}/port-error.txt"
              )" || status=1
              printf '%s\n' "${published_port}" > "${evidence}/published-port.txt"
              if [[ "${published_port}" != "127.0.0.1:${port}" ]]; then
                status=1
              fi
            fi
            if (( status == 0 )); then
              local deadline=$((SECONDS + 180))
              until curl --fail --silent --show-error --max-time 5 \
                "http://127.0.0.1:${port}/health" >/dev/null; do
                if (( SECONDS >= deadline )); then
                  status=1
                  break
                fi
                sleep 2
              done
            fi
            if (( status == 0 )); then
              env -u PYTHONPATH \
                python -I tests/integration/datahub/gms_v170_gate.py \
                  --gms-url "http://127.0.0.1:${port}" \
                  --streamt-executable "${DATAHUB_STREAMT_VENV}/bin/streamt" \
                  --datahub-executable "${DATAHUB_CLI_VENV}/bin/datahub" \
                  --variant "${variant}" \
                  > "${evidence}/gate-summary.json" 2>&1 || status=1
            fi
            if [[ ! -s "${evidence}/gate-summary.json" ]]; then
              printf '{"status":"error","variant":"%s"}\n' "${variant}" \
                > "${evidence}/gate-summary.json"
            fi

            compose_bounded 20s ps --all --format json \
              2> "${evidence}/compose-status-error.txt" \
              | jq -s 'map({Service, State, Health, ExitCode})' \
              > "${evidence}/compose-status.json" || true
            compose_bounded 30s logs --no-color --timestamps --tail 300 \
              kafka-broker mysql opensearch system-update-quickstart \
              datahub-gms-quickstart 2>&1 | tail -c 1048576 \
              > "${evidence}/compose.log" || true

            if ! compose_bounded 2m down --volumes --remove-orphans --timeout 30 \
              > "${evidence}/cleanup.txt" 2>&1; then
              cleanup_status=1
            fi
            {
              docker ps -aq --filter "label=com.docker.compose.project=${project}"
              docker network ls -q --filter "label=com.docker.compose.project=${project}"
              docker volume ls -q --filter "label=com.docker.compose.project=${project}"
            } > "${evidence}/residue.txt" 2>&1 || cleanup_status=1
            if [[ -s "${evidence}/residue.txt" ]]; then
              cleanup_status=1
            fi
            if (( status != 0 || cleanup_status != 0 )); then
              overall_status=1
            fi
          }

          run_variant with-kafka-instance wi 18080
          run_variant without-kafka-instance wo 18081
          exit "${overall_status}"

      - name: Ensure exact DataHub projects are removed
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "${DATAHUB_EVIDENCE_DIR}"
          cleanup_status=0
          for entry in wi:18080 wo:18081; do
            suffix="${entry%%:*}"
            port="${entry##*:}"
            project="dh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}"
            if [[ -s "${DATAHUB_COMPOSE_FILE}" \
              && -s "${DATAHUB_COMPOSE_OVERRIDE}" \
              && -s "${DATAHUB_ENV_FILE}" ]]; then
              timeout --foreground --signal=TERM --kill-after=20s 2m \
                env COMPOSE_PROJECT_NAME="${project}" DATAHUB_MAPPED_GMS_PORT="${port}" \
                docker compose --ansi never --progress plain \
                  --env-file "${DATAHUB_ENV_FILE}" \
                  -f "${DATAHUB_COMPOSE_FILE}" \
                  -f "${DATAHUB_COMPOSE_OVERRIDE}" \
                  -p "${project}" --profile quickstart-backend \
                  down --volumes --remove-orphans --timeout 30 \
                  >> "${DATAHUB_EVIDENCE_DIR}/final-cleanup.txt" 2>&1 \
                || cleanup_status=1
            fi
            residue="$({
              docker ps -aq --filter "label=com.docker.compose.project=${project}"
              docker network ls -q --filter "label=com.docker.compose.project=${project}"
              docker volume ls -q --filter "label=com.docker.compose.project=${project}"
            } 2>/dev/null)" || cleanup_status=1
            if [[ -n "${residue}" ]]; then
              printf '%s\n' "${project}: ${residue}" \
                >> "${DATAHUB_EVIDENCE_DIR}/final-residue.txt"
              cleanup_status=1
            fi
          done
          exit "${cleanup_status}"

      - name: Upload bounded DataHub GMS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datahub-gms-v170-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DATAHUB_EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 14

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Check generated project schema
        run: |
          streamt docs schema --output-file /tmp/stream_project.schema.json
          diff -u schemas/stream_project.schema.json /tmp/stream_project.schema.json
