name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and scenario tests
        run: python -m pytest tests/unit tests/scenarios --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: ruff check src/ tests/

  type-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enforce mypy error ceiling
        run: python scripts/check_mypy_baseline.py

  gateway-strict-observer:
    name: Conduktor Gateway 3.15 strict observe/delete/adopt
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start Kafka and Conduktor Gateway
        run: |
          docker compose pull kafka conduktor-gateway
          docker compose up -d kafka conduktor-gateway

      - name: Wait for Conduktor Gateway readiness
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl --fail --silent http://127.0.0.1:8888/health >/dev/null \
            && curl --fail --silent --user admin:conduktor \
              http://127.0.0.1:8888/gateway/v2/alias-topic >/dev/null; do
            if (( SECONDS >= deadline )); then
              docker compose ps
              exit 1
            fi
            sleep 2
          done

      - name: Run strict managed observe/delete/adopt gate
        env:
          STREAMT_TEST_GATEWAY_STRICT_OBSERVER: '1'
          STREAMT_TEST_GATEWAY_ADMIN_URL: http://127.0.0.1:8888
          STREAMT_TEST_GATEWAY_ADMIN_USER: admin
          STREAMT_TEST_GATEWAY_ADMIN_PASSWORD: conduktor
          STREAMT_TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        run: >-
          python -m pytest
          tests/integration/test_gateway_strict_observer_real.py
          --tb=short

      - name: Collect Gateway service logs
        if: always()
        shell: bash
        run: |
          mkdir -p gateway-strict-observe-delete-adopt-artifacts
          docker compose ps \
            > gateway-strict-observe-delete-adopt-artifacts/compose-status.txt 2>&1 || true
          docker compose logs --no-color kafka conduktor-gateway \
            > gateway-strict-observe-delete-adopt-artifacts/compose.log 2>&1 || true

      - name: Upload Gateway service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-strict-observe-delete-adopt-logs
          path: gateway-strict-observe-delete-adopt-artifacts/
          if-no-files-found: warn

      - name: Stop Gateway services
        if: always()
        run: docker compose down --volumes --remove-orphans

  postgres-conformance:
    name: PostgreSQL ${{ matrix.postgres-major }} conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-major: ['14', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres-major }}
        env:
          POSTGRES_USER: streamt_ci_bootstrap
          POSTGRES_PASSWORD: streamt-ci-bootstrap-only
          POSTGRES_DB: streamt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamt_ci_bootstrap -d streamt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      STREAMT_TEST_POSTGRES_ADMIN_DSN: postgresql://streamt_ci_bootstrap:streamt-ci-bootstrap-only@127.0.0.1:5432/streamt_ci?sslmode=disable
      STREAMT_TEST_POSTGRES_MAJOR: ${{ matrix.postgres-major }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PostgreSQL test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Verify PostgreSQL readiness and major
        run: python tests/postgres/check_server.py

      - name: Run real PostgreSQL conformance tests
        run: python -m pytest tests/postgres -m postgres --tb=short

      - name: Run PostgreSQL command tests from the installed wheel
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-postgres-wheel-XXXXXX")"
          wheel_dir="${isolated_root}/dist"
          venv_dir="${isolated_root}/venv"
          base_venv_dir="${isolated_root}/base-venv"
          test_root="${isolated_root}/tests-root"

          python -m pip install build
          python -m build --wheel --outdir "${wheel_dir}"
          python -m venv "${venv_dir}"
          python -m venv "${base_venv_dir}"

          wheels=("${wheel_dir}"/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one wheel in ${wheel_dir}" >&2
            exit 1
          fi
          "${venv_dir}/bin/python" -m pip install "${wheels[0]}[postgres]" pytest
          "${base_venv_dir}/bin/python" -m pip install "${wheels[0]}" pytest

          mkdir -p "${test_root}/tests/postgres"
          cp tests/__init__.py "${test_root}/tests/__init__.py"
          cp tests/postgres/__init__.py "${test_root}/tests/postgres/__init__.py"
          cp tests/postgres/conftest.py "${test_root}/tests/postgres/conftest.py"
          cp tests/postgres/test_postgres_state_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_state_commands_real.py"
          cp tests/postgres/test_postgres_state_command_concurrency_real.py \
            "${test_root}/tests/postgres/test_postgres_state_command_concurrency_real.py"
          cp tests/postgres/test_postgres_state_command_failures_real.py \
            "${test_root}/tests/postgres/test_postgres_state_command_failures_real.py"
          cp tests/postgres/test_postgres_recovery_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_recovery_commands_real.py"
          cp tests/postgres/test_postgres_ordinary_factory_commands_real.py \
            "${test_root}/tests/postgres/test_postgres_ordinary_factory_commands_real.py"
          cp tests/postgres/test_postgres_openlineage_apply_real.py \
            "${test_root}/tests/postgres/test_postgres_openlineage_apply_real.py"

          cd "${test_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            "${venv_dir}/bin/python" -I - <<'PY'
          import os
          import sys
          from pathlib import Path

          import streamt

          checkout = Path(os.environ["STREAMT_CHECKOUT"]).resolve()
          checkout_source = checkout / "src"
          installed_module = Path(streamt.__file__).resolve()
          import_roots = {Path(entry).resolve() for entry in sys.path if entry}
          assert checkout_source not in import_roots, import_roots
          assert checkout not in installed_module.parents, installed_module
          PY
          env -u PYTHONPATH STREAMT_EXPECT_POSTGRES_EXTRA_MISSING=1 \
            "${base_venv_dir}/bin/python" -I -m pytest \
            tests/postgres/test_postgres_ordinary_factory_commands_real.py \
            -k base_wheel_without_postgres_extra -m postgres --tb=short
          env -u PYTHONPATH "${venv_dir}/bin/python" -I -m pytest \
            tests/postgres/test_postgres_state_commands_real.py \
            tests/postgres/test_postgres_state_command_concurrency_real.py \
            tests/postgres/test_postgres_state_command_failures_real.py \
            tests/postgres/test_postgres_recovery_commands_real.py \
            tests/postgres/test_postgres_ordinary_factory_commands_real.py \
            tests/postgres/test_postgres_openlineage_apply_real.py \
            -m postgres --tb=short

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Build distributions
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/streamt-wheel-smoke
          /tmp/streamt-wheel-smoke/bin/pip install dist/*.whl
          /tmp/streamt-wheel-smoke/bin/streamt --help
          /tmp/streamt-wheel-smoke/bin/streamt adopt --help | grep -F connector
          /tmp/streamt-wheel-smoke/bin/streamt adopt --help | grep -F gateway_rule
          /tmp/streamt-wheel-smoke/bin/python -c 'from streamt.docs.asyncapi import generate_asyncapi_document; from streamt.core.models import StreamtProject; project = StreamtProject.model_validate({"apiVersion": "streamt.dev/v1alpha1", "project": {"name": "wheel-smoke"}, "runtime": {"kafka": {"bootstrap_servers": "localhost:9092"}}, "sources": [{"name": "events", "topic": "events"}]}); assert generate_asyncapi_document(project)["asyncapi"] == "3.1.0"'

      - name: Verify OpenLineage schemas in wheel and source distribution
        shell: bash
        env:
          STREAMT_TEST_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          /tmp/streamt-wheel-smoke/bin/pip install pytest
          cd /tmp
          env -u PYTHONPATH /tmp/streamt-wheel-smoke/bin/python -I -m pytest \
            "${GITHUB_WORKSPACE}/tests/unit/test_openlineage_validation.py::test_built_wheel_and_source_distribution_contain_openlineage_resources" \
            --tb=short

      - name: Verify Backstage schemas in wheel and source distribution
        timeout-minutes: 3
        shell: bash
        env:
          STREAMT_TEST_DISTRIBUTIONS_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          cd /tmp
          env -u PYTHONPATH /tmp/streamt-wheel-smoke/bin/python -I -m pytest \
            "${GITHUB_WORKSPACE}/tests/unit/test_backstage_validation.py::test_built_wheel_and_source_distribution_contain_backstage_resources" \
            --tb=short

      - name: Smoke-test installed ODCS export offline
        run: |
          cd /tmp
          /tmp/streamt-wheel-smoke/bin/python - <<'PY'
          import socket
          import tempfile
          from pathlib import Path

          import yaml
          from click.testing import CliRunner

          def fail_network(*_args: object, **_kwargs: object) -> None:
              raise AssertionError("installed ODCS export attempted network access")

          socket.getaddrinfo = fail_network
          socket.create_connection = fail_network

          from streamt.cli import main
          from streamt.docs.odcs import _official_schema, validate_odcs_document

          schema = _official_schema()
          assert schema["$schema"] == "https://json-schema.org/draft/2019-09/schema"

          project_dir = Path(tempfile.mkdtemp(prefix="streamt-odcs-wheel-"))
          (project_dir / "stream_project.yml").write_text(
              yaml.safe_dump(
                  {
                      "apiVersion": "streamt.dev/v1alpha1",
                      "project": {"name": "wheel-smoke", "version": "1.0.0"},
                      "runtime": {
                          "kafka": {
                              "bootstrap_servers": "offline.invalid:9092",
                          }
                      },
                      "sources": [
                          {
                              "name": "events",
                              "topic": "events.v1",
                              "columns": [
                                  {"name": "id", "type": "BIGINT", "required": True}
                              ],
                          }
                      ],
                  },
                  sort_keys=False,
              ),
              encoding="utf-8",
          )
          result = CliRunner().invoke(
              main,
              [
                  "docs",
                  "odcs",
                  "--project-dir",
                  str(project_dir),
                  "--contract-id",
                  "urn:streamt:wheel-smoke",
                  "--status",
                  "draft",
              ],
              catch_exceptions=False,
          )
          assert result.exit_code == 0, result.output
          document = yaml.safe_load(result.stdout)
          assert document["apiVersion"] == "v3.1.0"
          assert document["id"] == "urn:streamt:wheel-smoke"
          assert "offline.invalid" not in result.stdout
          validate_odcs_document(document)
          PY

      - name: Smoke-test installed Gateway removal workflow
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-gateway-wheel-XXXXXX")"
          cp tests/package/gateway_removal_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            /tmp/streamt-wheel-smoke/bin/python -I gateway_removal_wheel_smoke.py

      - name: Smoke-test installed Gateway adoption workflow
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-gateway-adopt-wheel-XXXXXX")"
          cp tests/package/gateway_adoption_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            /tmp/streamt-wheel-smoke/bin/python -I gateway_adoption_wheel_smoke.py

      - name: Smoke-test installed durable OpenLineage apply telemetry
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-openlineage-apply-wheel-XXXXXX")"
          cp tests/package/openlineage_apply_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            /tmp/streamt-wheel-smoke/bin/python -I openlineage_apply_wheel_smoke.py

      - name: Smoke-test installed Backstage catalog export offline
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-backstage-wheel-XXXXXX")"
          source_baseline_path="${RUNNER_TEMP}/streamt-backstage-catalog-source.yaml"
          parity_path="${RUNNER_TEMP}/streamt-backstage-catalog-parity.yaml"
          cp tests/package/backstage_catalog_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env \
            PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_BACKSTAGE_SOURCE_BASELINE_PATH="${source_baseline_path}" \
            STREAMT_BACKSTAGE_SOURCE_MODE=1 \
            /tmp/streamt-wheel-smoke/bin/python backstage_catalog_wheel_smoke.py
          env -u PYTHONPATH \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_BACKSTAGE_SOURCE_BASELINE_PATH="${source_baseline_path}" \
            STREAMT_BACKSTAGE_PARITY_PATH="${parity_path}" \
            /tmp/streamt-wheel-smoke/bin/python -I backstage_catalog_wheel_smoke.py
          printf 'STREAMT_BACKSTAGE_PARITY_PATH=%s\n' "${parity_path}" >> "${GITHUB_ENV}"

      - name: Setup Node.js for Backstage release parity
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate installed-wheel Backstage YAML with pinned Node packages
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          test -s "${STREAMT_BACKSTAGE_PARITY_PATH}"
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/streamt-backstage-node-XXXXXX")"
          npm install \
            --prefix "${audit_dir}" \
            --ignore-scripts \
            --no-save \
            --package-lock=false \
            @backstage/catalog-model@1.10.0 \
            yaml@2.8.1
          cp tests/package/backstage_catalog_node_validate.cjs "${audit_dir}/validate.cjs"
          cd "${audit_dir}"
          validator_output="$(node validate.cjs < "${STREAMT_BACKSTAGE_PARITY_PATH}")"
          test -z "${validator_output}"

      - name: Smoke-test installed DataHub catalog export offline
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-datahub-wheel-XXXXXX")"
          baseline_dir="${RUNNER_TEMP}/streamt-datahub-source-baselines"
          artifact_dir="${RUNNER_TEMP}/streamt-datahub-mcp-artifacts"
          mkdir -p "${baseline_dir}" "${artifact_dir}"
          cp tests/package/datahub_catalog_wheel_smoke.py "${isolated_root}/"
          cd "${isolated_root}"
          env \
            PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_DATAHUB_BASELINE_DIR="${baseline_dir}" \
            STREAMT_DISTRIBUTIONS_DIR="${GITHUB_WORKSPACE}/dist" \
            STREAMT_DATAHUB_SOURCE_MODE=1 \
            /tmp/streamt-wheel-smoke/bin/python datahub_catalog_wheel_smoke.py
          env -u PYTHONPATH \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_DATAHUB_BASELINE_DIR="${baseline_dir}" \
            STREAMT_DATAHUB_ARTIFACT_DIR="${artifact_dir}" \
            /tmp/streamt-wheel-smoke/bin/python -I datahub_catalog_wheel_smoke.py
          test -s "${artifact_dir}/with-instance.json"
          test -s "${artifact_dir}/without-kafka-instance.json"
          printf 'STREAMT_DATAHUB_ARTIFACT_DIR=%s\n' "${artifact_dir}" >> "${GITHUB_ENV}"

      - name: Upload DataHub MCP oracle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: datahub-catalog-mcp-artifacts
          path: ${{ env.STREAMT_DATAHUB_ARTIFACT_DIR }}/
          if-no-files-found: error

      - name: Upload wheel for DataHub compatibility matrix
        uses: actions/upload-artifact@v7
        with:
          name: datahub-streamt-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload Python 3.10 DataHub source baselines
        uses: actions/upload-artifact@v7
        with:
          name: datahub-catalog-source-baselines
          path: ${{ runner.temp }}/streamt-datahub-source-baselines/
          if-no-files-found: error

      - name: Smoke-test installed PostgreSQL extra
        run: |
          python -m venv /tmp/streamt-postgres-wheel-smoke
          python - <<'PY'
          import glob
          import subprocess

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          subprocess.check_call(
              [
                  "/tmp/streamt-postgres-wheel-smoke/bin/pip",
                  "install",
                  f"{wheels[0]}[postgres]",
              ]
          )
          PY
          cd /tmp
          /tmp/streamt-postgres-wheel-smoke/bin/python -c 'import psycopg; from streamt.deployer.postgres_state import PostgresStateAdministration; assert psycopg.__version__'

  datahub-release-oracle:
    name: DataHub 1.7.0 oracle (Python ${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built streamt wheel
        uses: actions/download-artifact@v8
        with:
          name: datahub-streamt-wheel
          path: ${{ runner.temp }}/streamt-datahub-wheel

      - name: Download Python 3.10 source baselines
        uses: actions/download-artifact@v8
        with:
          name: datahub-catalog-source-baselines
          path: ${{ runner.temp }}/streamt-datahub-source-baselines

      - name: Download Python 3.10 installed-wheel reference artifacts
        uses: actions/download-artifact@v8
        with:
          name: datahub-catalog-mcp-artifacts
          path: ${{ runner.temp }}/streamt-datahub-reference-artifacts

      - name: Re-run installed-wheel parity without DataHub
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          isolated_root="$(mktemp -d "${RUNNER_TEMP}/streamt-datahub-lane-XXXXXX")"
          wheel_venv="${isolated_root}/wheel-venv"
          run_dir="${isolated_root}/run"
          artifact_dir="${isolated_root}/artifacts"
          mkdir -p "${run_dir}" "${artifact_dir}"
          wheels=("${RUNNER_TEMP}/streamt-datahub-wheel"/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one downloaded streamt wheel" >&2
            exit 1
          fi

          python -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install --upgrade pip
          "${wheel_venv}/bin/python" -m pip install --progress-bar off "${wheels[0]}"
          "${wheel_venv}/bin/python" -m pip check
          cp tests/package/datahub_catalog_wheel_smoke.py "${run_dir}/"
          cd "${run_dir}"
          env -u PYTHONPATH \
            STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            STREAMT_DATAHUB_BASELINE_DIR="${RUNNER_TEMP}/streamt-datahub-source-baselines" \
            STREAMT_DATAHUB_ARTIFACT_DIR="${artifact_dir}" \
            "${wheel_venv}/bin/python" -I datahub_catalog_wheel_smoke.py

          cmp "${artifact_dir}/with-instance.json" \
            "${RUNNER_TEMP}/streamt-datahub-reference-artifacts/with-instance.json"
          cmp "${artifact_dir}/without-kafka-instance.json" \
            "${RUNNER_TEMP}/streamt-datahub-reference-artifacts/without-kafka-instance.json"
          printf 'STREAMT_DATAHUB_LANE_ARTIFACT_DIR=%s\n' "${artifact_dir}" >> "${GITHUB_ENV}"

      - name: Validate lane artifacts with exact official DataHub release
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          oracle_root="$(mktemp -d "${RUNNER_TEMP}/streamt-datahub-oracle-XXXXXX")"
          oracle_venv="${oracle_root}/venv"
          python -m venv "${oracle_venv}"
          "${oracle_venv}/bin/python" -m pip install --upgrade pip
          "${oracle_venv}/bin/python" -m pip install \
            --progress-bar off 'acryl-datahub==1.7.0'
          "${oracle_venv}/bin/python" -m pip check
          "${oracle_venv}/bin/python" \
            tests/package/datahub_catalog_v170_oracle.py --self-test
          "${oracle_venv}/bin/python" \
            tests/package/datahub_catalog_v170_oracle.py \
            --artifact "${STREAMT_DATAHUB_LANE_ARTIFACT_DIR}/with-instance.json"
          "${oracle_venv}/bin/python" \
            tests/package/datahub_catalog_v170_oracle.py \
            --artifact "${STREAMT_DATAHUB_LANE_ARTIFACT_DIR}/without-kafka-instance.json"

  datahub-gms-v170:
    name: DataHub v1.7.0 real GMS acceptance
    needs: [package, datahub-release-oracle]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATAHUB_COMPOSE_FILE: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/upstream-compose.yml
      DATAHUB_COMPOSE_OVERRIDE: ${{ github.workspace }}/tests/integration/datahub/v1.7.0/docker-compose.override.yml
      DATAHUB_ENV_FILE: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/compose.env
      DATAHUB_EVIDENCE_DIR: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/evidence
      DATAHUB_STREAMT_VENV: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/streamt-venv
      DATAHUB_CLI_VENV: /tmp/streamt-datahub-gms-${{ github.run_id }}-${{ github.run_attempt }}/datahub-venv

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Download exact built streamt wheel
        uses: actions/download-artifact@v8
        with:
          name: datahub-streamt-wheel
          path: ${{ runner.temp }}/datahub-gms-v170/wheel

      - name: Prepare isolated installed-package environments
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${DATAHUB_EVIDENCE_DIR}"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/datahub-gms-v170/wheel" \
            -maxdepth 1 -type f -name '*.whl' -print)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one downloaded streamt wheel" >&2
            exit 1
          fi
          if [[ $(find "${RUNNER_TEMP}/datahub-gms-v170/wheel" \
            -maxdepth 1 -type f | wc -l) -ne 1 ]]; then
            echo "Downloaded wheel artifact contains unexpected files" >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"
          test -s "${wheel}"
          sha256sum "${wheel}" > "${DATAHUB_EVIDENCE_DIR}/streamt-wheel.sha256"

          python -m venv "${DATAHUB_STREAMT_VENV}"
          "${DATAHUB_STREAMT_VENV}/bin/python" -m pip install --upgrade pip
          "${DATAHUB_STREAMT_VENV}/bin/python" -m pip install \
            --progress-bar off "${wheel}"
          "${DATAHUB_STREAMT_VENV}/bin/python" -m pip check
          env -u PYTHONPATH STREAMT_CHECKOUT="${GITHUB_WORKSPACE}" \
            "${DATAHUB_STREAMT_VENV}/bin/python" -I - <<'PY'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          import streamt

          checkout = Path(os.environ["STREAMT_CHECKOUT"]).resolve()
          installed_module = Path(streamt.__file__).resolve()
          import_roots = {Path(entry).resolve() for entry in sys.path if entry}
          assert checkout not in installed_module.parents, installed_module
          assert checkout / "src" not in import_roots, import_roots
          assert importlib.util.find_spec("datahub") is None
          PY

          python -m venv "${DATAHUB_CLI_VENV}"
          "${DATAHUB_CLI_VENV}/bin/python" -m pip install --upgrade pip
          "${DATAHUB_CLI_VENV}/bin/python" -m pip install \
            --progress-bar off 'acryl-datahub==1.7.0'
          "${DATAHUB_CLI_VENV}/bin/python" -m pip check
          env -u PYTHONPATH "${DATAHUB_CLI_VENV}/bin/python" -I - <<'PY'
          import importlib.metadata
          import importlib.util

          assert importlib.metadata.version("acryl-datahub") == "1.7.0"
          assert importlib.util.find_spec("streamt") is None
          PY

      - name: Preflight and lock the official DataHub Compose file
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -m)" = "x86_64"
          docker version >/dev/null
          compose_version="$(docker compose version --short | sed 's/^v//')"
          if [[ "$(printf '2.24.4\n%s\n' "${compose_version}" | sort -V | head -n 1)" != "2.24.4" ]]; then
            echo "Docker Compose 2.24.4 or newer is required" >&2
            exit 1
          fi
          available_memory_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          available_disk_kib="$(df -Pk "${RUNNER_TEMP}" | awk 'NR == 2 {print $4}')"
          if (( available_memory_kib < 8 * 1024 * 1024 )); then
            echo "DataHub gate requires at least 8 GiB available memory" >&2
            exit 1
          fi
          if (( available_disk_kib < 13 * 1024 * 1024 )); then
            echo "DataHub gate requires at least 13 GiB available disk" >&2
            exit 1
          fi
          {
            uname -m
            docker version --format '{{.Server.Version}}'
            docker compose version
            awk '/^MemAvailable:/ {print}' /proc/meminfo
            df -Pk "${RUNNER_TEMP}"
          } > "${DATAHUB_EVIDENCE_DIR}/preflight.txt"

          mkdir -p "$(dirname "${DATAHUB_COMPOSE_FILE}")"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --output "${DATAHUB_COMPOSE_FILE}" \
            https://raw.githubusercontent.com/datahub-project/datahub/7f81ccbfe27b9acc947f5f600fcf9ddb72138a80/docker/quickstart/docker-compose.quickstart-profile.yml
          printf '%s  %s\n' \
            ec476d12f6f278c50d657a617357a050510565ef00b570a69cbe9123a932a7b7 \
            "${DATAHUB_COMPOSE_FILE}" | sha256sum --check --strict
          test -s "${DATAHUB_COMPOSE_OVERRIDE}"

          signing_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          signing_salt="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          mysql_password="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::${signing_key}"
          echo "::add-mask::${signing_salt}"
          echo "::add-mask::${mysql_password}"
          umask 077
          {
            printf 'DATAHUB_VERSION=v1.7.0\n'
            printf 'UI_INGESTION_DEFAULT_CLI_VERSION=1.7.0\n'
            printf 'DATAHUB_TELEMETRY_ENABLED=false\n'
            printf 'DATAHUB_TOKEN_SERVICE_SIGNING_KEY=%s\n' "${signing_key}"
            printf 'DATAHUB_TOKEN_SERVICE_SALT=%s\n' "${signing_salt}"
            printf 'DATAHUB_MYSQL_PASSWORD=%s\n' "${mysql_password}"
          } > "${DATAHUB_ENV_FILE}"

          COMPOSE_PROJECT_NAME="dh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-check" \
          DATAHUB_MAPPED_GMS_PORT=18080 \
            docker compose --env-file "${DATAHUB_ENV_FILE}" \
              -f "${DATAHUB_COMPOSE_FILE}" \
              -f "${DATAHUB_COMPOSE_OVERRIDE}" config --quiet
          printf '%s\n' \
            'commit=7f81ccbfe27b9acc947f5f600fcf9ddb72138a80' \
            'compose_sha256=ec476d12f6f278c50d657a617357a050510565ef00b570a69cbe9123a932a7b7' \
            > "${DATAHUB_EVIDENCE_DIR}/upstream-lock.txt"

      - name: Pull exact DataHub v1.7.0 dependency closure
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          images=(
            'acryldata/datahub-gms:v1.7.0@sha256:54bc4431402846a72d1c1bdb69fae1148f74a59425144aa947fdf1c3506461f7'
            'acryldata/datahub-upgrade:v1.7.0@sha256:21e77ad964be64b2b5a7f74c9685897ed79e8854995242eaa5e5c426395b88c0'
            'confluentinc/cp-kafka:8.2.2@sha256:8e01c0305844d6c05bfb8e86479f5f363bb6a53497625395943a9da780de67ce'
            'mysql:8.2@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1'
            'opensearchproject/opensearch:2.19.3@sha256:e96cc6ae1500a073d973c0906f30f7cf4d9c461f32f855f9242a2da933660cdd'
          )
          printf '%s\n' "${images[@]}" > "${DATAHUB_EVIDENCE_DIR}/locked-images.txt"
          for image in "${images[@]}"; do
            docker pull --platform linux/amd64 "${image}"
            docker image inspect --format '{{.Id}}' "${image}" \
              >> "${DATAHUB_EVIDENCE_DIR}/pulled-image-ids.txt"
          done

      - name: Run both fresh real-GMS variants
        timeout-minutes: 35
        shell: bash
        run: |
          set -uo pipefail

          overall_status=0
          run_variant() {
            local variant="$1"
            local suffix="$2"
            local port="$3"
            local project="dh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}"
            local evidence="${DATAHUB_EVIDENCE_DIR}/${variant}"
            local status=0
            local cleanup_status=0
            mkdir -p "${evidence}"
            printf '{"status":"not_run","variant":"%s"}\n' "${variant}" \
              > "${evidence}/gate-summary.json"

            compose_bounded() {
              local duration="$1"
              shift
              timeout --foreground --signal=TERM --kill-after=20s "${duration}" \
                env COMPOSE_PROJECT_NAME="${project}" DATAHUB_MAPPED_GMS_PORT="${port}" \
                docker compose --ansi never --progress plain \
                  --env-file "${DATAHUB_ENV_FILE}" \
                  -f "${DATAHUB_COMPOSE_FILE}" \
                  -f "${DATAHUB_COMPOSE_OVERRIDE}" \
                  -p "${project}" "$@"
            }

            if ! compose_bounded 8m up -d --no-build --pull never \
              datahub-gms-quickstart; then
              status=1
            fi
            if (( status == 0 )); then
              local deadline=$((SECONDS + 180))
              until curl --fail --silent --show-error --max-time 5 \
                "http://127.0.0.1:${port}/health" >/dev/null; do
                if (( SECONDS >= deadline )); then
                  status=1
                  break
                fi
                sleep 2
              done
            fi
            if (( status == 0 )); then
              env -u PYTHONPATH \
                python -I tests/integration/datahub/gms_v170_gate.py \
                  --gms-url "http://127.0.0.1:${port}" \
                  --streamt-executable "${DATAHUB_STREAMT_VENV}/bin/streamt" \
                  --datahub-executable "${DATAHUB_CLI_VENV}/bin/datahub" \
                  --variant "${variant}" \
                  > "${evidence}/gate-summary.json" 2>&1 || status=1
            fi
            if [[ ! -s "${evidence}/gate-summary.json" ]]; then
              printf '{"status":"error","variant":"%s"}\n' "${variant}" \
                > "${evidence}/gate-summary.json"
            fi

            compose_bounded 20s ps --all --format json \
              > "${evidence}/compose-status.json" 2>&1 || true
            compose_bounded 30s logs --no-color --timestamps --tail 300 \
              kafka-broker mysql opensearch system-update-quickstart \
              datahub-gms-quickstart 2>&1 | tail -c 1048576 \
              > "${evidence}/compose.log" || true

            if ! compose_bounded 2m down --volumes --remove-orphans --timeout 30 \
              > "${evidence}/cleanup.txt" 2>&1; then
              cleanup_status=1
            fi
            {
              docker ps -aq --filter "label=com.docker.compose.project=${project}"
              docker network ls -q --filter "label=com.docker.compose.project=${project}"
              docker volume ls -q --filter "label=com.docker.compose.project=${project}"
            } > "${evidence}/residue.txt" 2>&1 || cleanup_status=1
            if [[ -s "${evidence}/residue.txt" ]]; then
              cleanup_status=1
            fi
            if (( status != 0 || cleanup_status != 0 )); then
              overall_status=1
            fi
          }

          run_variant with-kafka-instance wi 18080
          run_variant without-kafka-instance wo 18081
          exit "${overall_status}"

      - name: Ensure exact DataHub projects are removed
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "${DATAHUB_EVIDENCE_DIR}"
          cleanup_status=0
          for entry in wi:18080 wo:18081; do
            suffix="${entry%%:*}"
            port="${entry##*:}"
            project="dh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}"
            if [[ -s "${DATAHUB_COMPOSE_FILE}" \
              && -s "${DATAHUB_COMPOSE_OVERRIDE}" \
              && -s "${DATAHUB_ENV_FILE}" ]]; then
              timeout --foreground --signal=TERM --kill-after=20s 2m \
                env COMPOSE_PROJECT_NAME="${project}" DATAHUB_MAPPED_GMS_PORT="${port}" \
                docker compose --ansi never --progress plain \
                  --env-file "${DATAHUB_ENV_FILE}" \
                  -f "${DATAHUB_COMPOSE_FILE}" \
                  -f "${DATAHUB_COMPOSE_OVERRIDE}" \
                  -p "${project}" down --volumes --remove-orphans --timeout 30 \
                  >> "${DATAHUB_EVIDENCE_DIR}/final-cleanup.txt" 2>&1 \
                || cleanup_status=1
            fi
            residue="$({
              docker ps -aq --filter "label=com.docker.compose.project=${project}"
              docker network ls -q --filter "label=com.docker.compose.project=${project}"
              docker volume ls -q --filter "label=com.docker.compose.project=${project}"
            } 2>/dev/null)" || cleanup_status=1
            if [[ -n "${residue}" ]]; then
              printf '%s\n' "${project}: ${residue}" \
                >> "${DATAHUB_EVIDENCE_DIR}/final-residue.txt"
              cleanup_status=1
            fi
          done
          exit "${cleanup_status}"

      - name: Upload bounded DataHub GMS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datahub-gms-v170-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DATAHUB_EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 14

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Check generated project schema
        run: |
          streamt docs schema --output-file /tmp/stream_project.schema.json
          diff -u schemas/stream_project.schema.json /tmp/stream_project.schema.json
